[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-failure-lab"
version = "0.3.0"
description = "Reproduce uncertain tool writes, inspect agent traces, and grade committed effects."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Dev Patel"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Topic :: Software Development :: Testing"]

[project.optional-dependencies]
agents = ["openai-agents==0.23.1", "openai==3.26.1"]
dev = ["ruff==0.16.10", "build==1.6.1", "playwright==1.63.0"]

[project.scripts]
afl = "agent_failure_lab.cli:main"

[project.urls]
Repository = "https://github.com/DevPatel3547/agent-failure-lab"
Issues = "https://github.com/DevPatel3547/agent-failure-lab/issues"

[tool.setuptools.packages.find]
include = ["agent_failure_lab*"]

[tool.setuptools.package-data]
agent_failure_lab = ["assets/*", "fixtures/*.json"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
